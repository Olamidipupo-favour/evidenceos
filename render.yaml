# EvidenceOS API — Render Blueprint
#
# Provisions the managed PostgreSQL database AND the deployed API in one file.
# Steps:
#   1. Push this repo to a GitHub/GitLab public or private repo.
#   2. Render dashboard: "New +" > "Blueprint" > pick the repo (or "Public repo").
#   3. Render runs `backend/Dockerfile`, applies migrations + the demo seed, and
#      points health checks at /health/ready.
#   4. Secrets (PUBMED_EMAIL, LLM_API_KEY, …) are marked `sync: false` below so
#      you must set them once in the dashboard (Blueprint > Environment).
#   5. Set CORS_ORIGINS to the deployed frontend origin (e.g. the Vercel URL).
#      The API falls back to localhost:3000 until you set it — which is a
#      partial-match risk if left unconfigured in production.
#
# Pricing: all services use FREE plans so no card is needed to deploy.
# Caveats of free plans: the web service spins down after ~15 min of
# inactivity (first request may take 30-60s to cold start) and the free
# Postgres DB expires after 30 days — renew or upgrade before the judging
# window.
#
# Keep-alive: the API pings its own public URL (RENDER_EXTERNAL_URL, injected
# by Render) via app/keepalive.py every 10 minutes, so the free instance never
# spins down while a boot is in flight. A Render clock/cron job would keep it
# alive even while asleep, but cron jobs require a paid plan (no free tier),
# so self-ping is the free-tier equivalent here.
databases:
  - name: evidenceos-db
    plan: free
    databaseName: evidenceos

services:
  - type: web
    name: evidenceos-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    # Docker build context defaults to the repo root, so frontend/ and webmcp/
    # are ignored via .dockerignore for fast image builds.
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: KEEPALIVE_INTERVAL
        # Seconds between self-pings (see app/keepalive.py). 600 keeps the
        # free instance under the ~15 min idle spin-down window.
        value: "600"
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceos-db
          property: connectionString
      - key: CORS_ORIGINS
        # MUST be set in the dashboard to the deployed frontend origin.
        sync: false
      - key: PUBMED_EMAIL
        # Set a real contact email (NCBI policy) in the dashboard.
        sync: false
      - key: PUBMED_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        # Optional: live evidence extraction. Without it, extraction returns
        # HTTP 503 but the seeded demo extractions are still present.
        sync: false
      - key: LLM_MODEL
        sync: false