[project]
name = "evidenceos-api"
version = "0.1.0"
description = "EvidenceOS backend API — FastAPI service backing the agent-native medical research workspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

# The API is not built/published as a wheel; `app` is imported from cwd.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom does use Depends() in default args.
"app/api/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "live: contacts the real NCBI E-utilities (opt-in via RUN_LIVE_TESTS=1)",
]
